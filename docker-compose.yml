services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - PUBLIC_DIRECTUS_PUBLIC_URL=${PUBLIC_DIRECTUS_PUBLIC_URL}
        - PUBLIC_DIRECTUS_URL=${PUBLIC_DIRECTUS_URL}
        - PUBLIC_UMAMI_URL=${PUBLIC_UMAMI_URL}
        - PUBLIC_UMAMI_WEBSITE_ID=${PUBLIC_UMAMI_WEBSITE_ID}
    restart: unless-stopped
    env_file: .env
    environment:
      - PUBLIC_DIRECTUS_URL=${PUBLIC_DIRECTUS_URL}
      - PUBLIC_DIRECTUS_PUBLIC_URL=${PUBLIC_DIRECTUS_PUBLIC_URL}
      - PUBLIC_UMAMI_URL=${PUBLIC_UMAMI_URL}
      - PUBLIC_UMAMI_WEBSITE_ID=${PUBLIC_UMAMI_WEBSITE_ID}
    depends_on:
      directus:
        condition: service_healthy
    networks:
      - periodico_net

  directus:
    image: directus/directus:12.1.1
    restart: unless-stopped
    ports:
      - "8055:8055"
    env_file: .env
    environment:
      SECRET: ${DIRECTUS_SECRET}
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_LOCATIONS: local
      STORAGE_LOCAL_ROOT: /directus/uploads
      PUBLIC_URL: ${PUBLIC_DIRECTUS_PUBLIC_URL}
      CORS_ENABLED: "true"
      CORS_ORIGIN: ${FRONTEND_URL}
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_POINTS: 50
      RATE_LIMITER_DURATION: 1
      MAX_PAYLOAD_SIZE: 50mb
      FILES_MAX_UPLOAD_SIZE: 50000000
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8055/server/health 2>&1 | grep -q HTTP"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - periodico_net

  database:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - periodico_net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    environment:
      - DOMAIN=${DOMAIN}
      - CMS_DOMAIN=${CMS_DOMAIN}
      - STATS_DOMAIN=${STATS_DOMAIN}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - directus
    networks:
      - periodico_net

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups/scripts:/scripts:ro
      - backups_data:/backups
      - directus_uploads:/uploads:ro
    entrypoint: ["sh", "/scripts/cron-backup.sh"]
    depends_on:
      database:
        condition: service_healthy
    networks:
      - periodico_net

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER}:${UMAMI_DB_PASSWORD}@umami_db:5432/${UMAMI_DB_NAME}
      APP_SECRET: ${UMAMI_SECRET}
    depends_on:
      umami_db:
        condition: service_healthy
    networks:
      - periodico_net

  umami_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${UMAMI_DB_NAME}
      POSTGRES_USER: ${UMAMI_DB_USER}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD}
    volumes:
      - umami_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${UMAMI_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - periodico_net

volumes:
  postgres_data:
  directus_uploads:
  directus_extensions:
  caddy_data:
  caddy_config:
  backups_data:
  umami_data:

networks:
  periodico_net:
    driver: bridge
