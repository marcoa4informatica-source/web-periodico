# Docker Compose para desarrollo local
# Uso: docker compose -f docker-compose.local.yml up -d
#
# URLs:
#   Web:    http://localhost:4321  (tarda ~2 min la primera vez en compilar)
#   Admin:  http://localhost:8055
#   Email:  admin@periodico.es
#   Pass:   admin1234
#   Stats:  http://localhost:3000  (Umami - usuario: admin / pass: umami)

services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "4321:4321"
    environment:
      PUBLIC_DIRECTUS_URL: http://directus:8055
      PUBLIC_DIRECTUS_PUBLIC_URL: http://localhost:8055
      PUBLIC_UMAMI_URL: http://localhost:3000
      PUBLIC_UMAMI_WEBSITE_ID: "788bc5b3-7848-40e5-bb08-c364669cfc64"
    restart: on-failure
    depends_on:
      - directus
    networks:
      - periodico_net

  directus:
    image: directus/directus:12.1.1
    restart: unless-stopped
    ports:
      - "8055:8055"
    environment:
      SECRET: local_secret_desarrollo_no_usar_en_produccion
      ADMIN_EMAIL: ${DIRECTUS_ADMIN_EMAIL:-admin@periodico.es}
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:-admin1234}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-periodico_db}
      DB_USER: ${POSTGRES_USER:-periodico_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-periodico_pass}
      PUBLIC_URL: http://localhost:8055
      CORS_ENABLED: "true"
      CORS_ORIGIN: "http://localhost:4321"
      MAX_PAYLOAD_SIZE: 50mb
      FILES_MAX_UPLOAD_SIZE: 50000000
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    depends_on:
      database:
        condition: service_healthy
    networks:
      - periodico_net

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-periodico_db}
      POSTGRES_USER: ${POSTGRES_USER:-periodico_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-periodico_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-periodico_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - periodico_net

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami_user:umami_pass@umami_db:5432/umami_db
      APP_SECRET: umami_local_secret_cambiar_en_produccion
    depends_on:
      umami_db:
        condition: service_healthy
    networks:
      - periodico_net

  umami_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: umami_db
      POSTGRES_USER: umami_user
      POSTGRES_PASSWORD: umami_pass
    volumes:
      - umami_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - periodico_net

volumes:
  postgres_data:
  directus_uploads:
  directus_extensions:
  umami_data:

networks:
  periodico_net:
    driver: bridge
